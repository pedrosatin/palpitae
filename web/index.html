<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Fundo escuro no primeiro paint, antes do CSS externo carregar, pra
         nunca haver flash branco enquanto JS/CSS e o auth resolvem -->
    <style>
      html {
        background-color: #0d0d0d;
      }

      /* O build embute a landing dentro do #root (ver scripts/prerender.mjs).
         Ela é o conteúdo certo só em "/" e só para quem nunca logou neste
         dispositivo. Nos demais casos o script logo abaixo marca o <html> com
         esta classe, e o #root fica invisível até o script no fim do body
         esvaziá-lo. É um cinto de segurança: mesmo que o navegador resolva
         pintar no meio do parse do HTML (acontece em conexões lentas, quando o
         documento chega em pedaços), a landing nunca aparece numa rota
         privada. As duas coisas são síncronas e acontecem antes de qualquer
         paint, então não há piscada em nenhuma direção. */
      .descartar-prerender #root {
        visibility: hidden;
      }
    </style>
    <script>
      // Roda antes de o body ser parseado — o #root ainda nem existe aqui.
      ;(function () {
        var landing = location.pathname === '/'
        try {
          // Mesma chave escrita por src/App.tsx (KNOWN_SESSION_KEY).
          if (localStorage.getItem('palpitae:sessao-conhecida') === '1') landing = false
        } catch (e) {
          // Storage bloqueado: seguimos tratando como visitante novo.
        }
        if (!landing) document.documentElement.classList.add('descartar-prerender')
      })()
    </script>

    <!-- Aquece a conexão com a API (auth/me roda no boot, em outro domínio) -->
    <link rel="preconnect" href="https://api.palpitae.com.br" crossorigin />
    <link rel="dns-prefetch" href="https://api.palpitae.com.br" />

    <!-- SEO básico -->
    <title>Palpitae | Bolão de futebol online — Brasileirão, Copa e mais</title>
    <meta
      name="description"
      content="Bolão do Brasileirão Série A com seus amigos. Crie grupos privados, dê palpites rodada a rodada e dispute a classificação. Gratuito, funciona no navegador."
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://palpitae.com.br/" />

    <!-- Favicon e ícones -->
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Open Graph (WhatsApp, LinkedIn, Facebook, Telegram) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Palpitae" />
    <meta
      property="og:title"
      content="Palpitae | Bolão de futebol online — Brasileirão, Copa e mais"
    />
    <meta
      property="og:description"
      content="Bolão do Brasileirão com seus amigos. Crie grupos privados, dê palpites rodada a rodada e dispute quem manja mais de futebol."
    />
    <meta property="og:url" content="https://palpitae.com.br/" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:image" content="https://palpitae.com.br/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Palpitae | Bolão de futebol online — Brasileirão, Copa e mais"
    />

    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Palpitae | Bolão de futebol online — Brasileirão, Copa e mais"
    />
    <meta
      name="twitter:description"
      content="Bolão do Brasileirão com seus amigos. Crie grupos privados, dê palpites rodada a rodada e dispute quem manja mais de futebol."
    />
    <meta name="twitter:image" content="https://palpitae.com.br/og-image.png" />
    <meta
      name="twitter:image:alt"
      content="Palpitae | Bolão de futebol online — Brasileirão, Copa e mais"
    />

    <!-- Cor do browser (mobile) -->
    <meta name="theme-color" content="#0d0d0d" />

    <!-- Preload da imagem hero em WebP (é o elemento de LCP); navegadores sem
         suporte a WebP ignoram o preload e carregam o PNG via <picture>.
         fetchpriority=high tira a imagem da fila de prioridade baixa em que o
         Chrome coloca preloads de imagem (auditoria lcp-discovery-insight). -->
    <link
      rel="preload"
      as="image"
      href="/screenshots/grupos.webp"
      type="image/webp"
      fetchpriority="high"
    />

    <!-- JSON-LD: dados estruturados para o Google -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Palpitae",
        "url": "https://palpitae.com.br",
        "description": "Bolão do Brasileirão Série A e da Copa do Mundo. Crie grupos privados com amigos, dê palpites rodada a rodada e dispute a classificação. Gratuito, funciona no navegador.",
        "applicationCategory": "SportsApplication",
        "operatingSystem": "Web",
        "inLanguage": "pt-BR",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "BRL"
        }
      }
    </script>

    <!-- JSON-LD: organização (ajuda em sitelinks/knowledge panel) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Palpitae",
        "url": "https://palpitae.com.br",
        "logo": "https://palpitae.com.br/apple-touch-icon.png"
      }
    </script>

    <!-- JSON-LD: FAQ (espelha a seção de perguntas frequentes da landing) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "O Palpitae é gratuito?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Sim. Você entra com sua conta Google e cria bolões sem pagar nada."
            }
          },
          {
            "@type": "Question",
            "name": "Como funciona a pontuação?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Você ganha 3 pontos por acertar o placar exato e 1 ponto por acertar apenas o resultado (vitória, empate ou derrota)."
            }
          },
          {
            "@type": "Question",
            "name": "Como entro em um grupo?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Peça o código ou o link de convite ao admin do grupo e use a opção \"Entrar em grupo\"."
            }
          },
          {
            "@type": "Question",
            "name": "Preciso instalar algum aplicativo?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Não. O Palpitae funciona direto no navegador, no celular ou no computador."
            }
          },
          {
            "@type": "Question",
            "name": "Quais campeonatos tem no Palpitae?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Brasileirão Série A 2026 e Copa do Mundo 2026. Você pode criar um grupo para cada campeonato, e novos torneios serão adicionados."
            }
          }
        ]
      }
    </script>
  </head>
  <body>
    <!-- O build substitui este marcador pela landing renderizada em HTML (ver
         scripts/prerender.mjs). É o que um crawler sem JS lê e, principalmente,
         é o que o navegador pinta antes de o bundle sequer chegar: a <img> do
         hero (elemento de LCP) passa a existir no primeiro paint. -->
    <div id="root"></div>
    <script>
      // Roda com o #root já no DOM e antes de qualquer paint (o CSS externo
      // ainda bloqueia a renderização neste ponto). Descarta a landing
      // pré-renderizada quando ela não é o que o visitante deve ver:
      //
      //  - rotas privadas: /entrar, /grupos/*, /configuracoes e /admin/* são
      //    reescritas para "/" pelo Cloudflare Pages (ver public/_redirects),
      //    então elas recebem ESTE mesmo HTML, com a landing dentro. Sem este
      //    descarte, um usuário logado indo para /grupos/123 veria a página de
      //    marketing piscar antes do React montar;
      //  - "/" em dispositivo que já teve sessão: vai para o dashboard, então
      //    também não deve piscar a landing.
      //
      // Esvaziar o #root aqui, e não em main.tsx, é o que garante que nada
      // disso chega à tela: main.tsx só roda depois de o bundle baixar.
      // Remover o atributo data-prerender é o sinal para main.tsx usar
      // createRoot em vez de hydrateRoot.
      ;(function () {
        if (!document.documentElement.classList.contains('descartar-prerender')) return
        var root = document.getElementById('root')
        if (root) {
          root.textContent = ''
          root.removeAttribute('data-prerender')
        }
        document.documentElement.classList.remove('descartar-prerender')
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
