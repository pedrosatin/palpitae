# Todo comando wrangler rodado em api/ precisa de --config ./wrangler.toml. Sem ele o
# wrangler procura wrangler.json e wrangler.jsonc em todos os diretórios acima antes
# de aceitar este arquivo, e o wrangler.jsonc da raiz (projeto do Pages) vence.
# Os scripts dev, dev:cron e deploy do package.json já passam a opção.
name = "palpitae-api"
main = "src/index.ts"
compatibility_date = "2025-01-01"

[[d1_databases]]
binding = "DB"
database_name = "palpitae"
database_id = "ffd7a7ed-3434-4db8-a505-b74c1cf79d6a"
migrations_dir = "migrations"

# Workers Logs — console.* viram pesquisáveis no dashboard (Free: 200k eventos/dia,
# retenção 3 dias). Debug operacional, não métrica histórica. Ver docs/observability.md.
[observability]
enabled = true

# Analytics Engine — hot path de eventos de negócio/saúde (retenção ~3 meses,
# grátis). O cold path (R2, retenção ilimitada) virá de um cron diário que exporta
# este dataset. Dataset é criado sozinho no primeiro writeDataPoint. Binding = AE.
[[analytics_engine_datasets]]
binding = "AE"
dataset = "palpitae_events"

# Crons (o handler `scheduled` distingue pelo controller.cron):
#  - "0,30 * * * *" → result poller: resultados da janela ativa + pontuação (ADR-007).
#    A cada 30 min; janela ativa = 85 min ⇒ no máx. 1 tick de atraso até pontuar.
#    Jogos sem resultado ou sem pontuação seguem na consulta por até 24 h (resgate).
#  - "5 0 * * *"    → cold path: exporta os eventos do dia anterior (AE → R2 NDJSON).
#    00:05 UTC, fora dos ticks 0/30 do poller. Ver docs/observability.md.
#  - "0 10 * * *"   → lembrete: e-mail para quem tem jogo de hoje sem palpite.
#    1x/dia às 10h UTC (07h BRT). Máximo de um e-mail por usuário por dia (ADR-020).
#  - "15 6 * * *"   → fixture discovery: busca jogos novos (mata-mata, remarcações)
#    das competições ativas. 1x/dia às 06:15 UTC (03:15 BRT), sem jogos e fora dos
#    ticks 0/30 do poller. Ver fixtureDiscovery.ts.
# As expressões abaixo precisam bater com api/src/crons.ts (um teste compara as duas).
# Cron sem ramo no handler só registra `scheduled_unknown_cron`.
# O radar de competições (/admin/oportunidades) NÃO tem cron aqui: a
# API-Football limita por IP e os IPs de saída dos Workers são compartilhados
# (429 na 1ª chamada, com a quota intacta). A coleta roda no GitHub Actions —
# .github/workflows/radar-sync.yml. Ver ADR-014.
[triggers]
crons = ["0,30 * * * *", "5 0 * * *", "0 10 * * *", "15 6 * * *"]

# Cold path — bucket R2 onde o export diário grava events/YYYY/MM/DD.ndjson.
# Criar antes do deploy (de api/):
#   npx wrangler r2 bucket create palpitae-events --config ./wrangler.toml
[[r2_buckets]]
binding = "EVENTS"
bucket_name = "palpitae-events"

[vars]
BASE_URL = "https://api.palpitae.com.br"
FRONTEND_URL = "https://palpitae.com.br"
# CF-Worker que o proxy do Pages envia (a Cloudflare preenche com o projeto).
# Renomear o projeto exige atualizar este valor. Ver docs/security.md.
FRONTEND_WORKER_ZONE = "palpitae-web.pages.dev"
# Opcional: teto de chamadas ao Resend por execução do lembrete diário (padrão 45,
# que cabe nos 50 subrequests do plano Free). Ver ADR-020.
# REMINDER_FETCH_BUDGET = "45"
# Secrets — gravar de api/, sempre com --config ./wrangler.toml. Sem ele o
# wrangler acha primeiro o wrangler.jsonc da raiz (projeto do Pages) e manda o
# secret para o Worker palpitae-web, não para este.
#   npx wrangler secret put JWT_SECRET --config ./wrangler.toml
#   npx wrangler secret put UNSUBSCRIBE_SECRET --config ./wrangler.toml # link de descadastro; trocar só se vazar, ver docs/security.md
#   npx wrangler secret put GOOGLE_CLIENT_ID --config ./wrangler.toml
#   npx wrangler secret put GOOGLE_CLIENT_SECRET --config ./wrangler.toml
#   npx wrangler secret put FOOTBALL_API_KEY --config ./wrangler.toml
#   npx wrangler secret put CF_ACCOUNT_ID --config ./wrangler.toml    # cold path: conta da SQL API do Analytics Engine
#   npx wrangler secret put AE_SQL_TOKEN --config ./wrangler.toml     # cold path: token Account Analytics:Read
#   npx wrangler secret put RESEND_API_KEY --config ./wrangler.toml   # round reminder: API key do Resend
#   npx wrangler secret put ADMIN_EMAIL --config ./wrangler.toml      # dashboard /metrics: e-mail do admin (403 sem ele)
#   npx wrangler secret put PROXY_SHARED_SECRET --config ./wrangler.toml # mesmo valor do Pages; ver docs/security.md
# Local overrides go in .dev.vars (already has localhost values)
