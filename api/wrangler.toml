name = "palpitae-api"
main = "src/index.ts"
compatibility_date = "2025-01-01"

workers_dev = false
preview_urls = false

[[d1_databases]]
binding = "DB"
database_name = "palpitae"
database_id = "ffd7a7ed-3434-4db8-a505-b74c1cf79d6a"
migrations_dir = "migrations"

# Workers Logs — console.* viram pesquisáveis no dashboard (Free: 200k eventos/dia,
# retenção 3 dias). Debug operacional, não métrica histórica. Ver docs/observability.md.
[observability]
enabled = true

# Analytics Engine — hot path de eventos de negócio/saúde (retenção ~3 meses,
# grátis). O cold path é o cron diário que exporta este dataset para o R2
# (palpitae-events, retenção de 13 meses). Dataset é criado sozinho no primeiro writeDataPoint. Binding = AE.
[[analytics_engine_datasets]]
binding = "AE"
dataset = "palpitae_events"

[triggers]
crons = ["0,5,10,20,25,30,35,40,50,55 * * * *", "5 0 * * *", "0 10 * * *", "15 6 * * *"]

# Cold path — bucket R2 onde o export diário grava events/YYYY/MM/DD.ndjson.
# Criar antes do deploy (de api/):
#   npx wrangler r2 bucket create palpitae-events --config ./wrangler.toml
[[r2_buckets]]
binding = "EVENTS"
bucket_name = "palpitae-events"

[vars]
BASE_URL = "https://api.palpitae.com.br"
FRONTEND_URL = "https://palpitae.com.br"
# Alerta por e-mail de resultado atrasado ao ADMIN_EMAIL (ver docs/observability.md).
# Reserva a janela antes de enviar; cooldown padrão de 6 h.
RESULT_OVERDUE_ALERT = "1"
# CF-Worker que a Cloudflare preenche no proxy do Pages, com o nome do projeto.
# Atualize antes ou junto de renomear o projeto Pages. Ver docs/security.md.
FRONTEND_WORKER_ZONE = "palpitae-web.pages.dev"
# Opcional: teto de chamadas ao Resend/Mailjet por execução do lembrete diário
# (padrão 45, que cabe nos 50 subrequests do plano Free). Ver ADR-020.
# REMINDER_FETCH_BUDGET = "45"
# Opcional: limiar em horas para resultado atrasado sem placar (padrão 3). Ver
# api/src/matches/resultOverdue.ts e docs/observability.md.
# RESULT_OVERDUE_HOURS = "3"
# Alerta de resultado atrasado: ligado em [vars] acima. Exige ADMIN_EMAIL e
# RESEND_API_KEY. Cooldown padrão 6 h.
# RESULT_OVERDUE_ALERT_COOLDOWN_HOURS = "6"
# Opcional: orçamento diário de linhas do D1 por usuário (padrões 250000 lidas e
# 5000 escritas). Valor que não seja inteiro positivo volta ao padrão. Ver ADR-022.
# D1_DAILY_ROWS_READ_PER_USER = "250000"
# D1_DAILY_ROWS_WRITTEN_PER_USER = "5000"
# Secrets — gravar de api/, sempre com --config ./wrangler.toml, pelo motivo do
# topo deste arquivo.
#   npx wrangler secret put JWT_SECRET --config ./wrangler.toml
#   npx wrangler secret put UNSUBSCRIBE_SECRET --config ./wrangler.toml # link de descadastro; trocar só se vazar, ver docs/security.md
#   npx wrangler secret put GOOGLE_CLIENT_ID --config ./wrangler.toml
#   npx wrangler secret put GOOGLE_CLIENT_SECRET --config ./wrangler.toml
#   npx wrangler secret put FOOTBALL_API_KEY --config ./wrangler.toml
#   npx wrangler secret put CF_ACCOUNT_ID --config ./wrangler.toml    # cold path: conta da SQL API do Analytics Engine
#   npx wrangler secret put AE_SQL_TOKEN --config ./wrangler.toml     # cold path: token Account Analytics:Read
#   npx wrangler secret put CF_ANALYTICS_TOKEN --config ./wrangler.toml # uso das cotas: outro token Account Analytics:Read
#   npx wrangler secret put RESEND_API_KEY --config ./wrangler.toml   # round reminder: API key do Resend
#   npx wrangler secret put MAILJET_API_KEY --config ./wrangler.toml  # fallback do lembrete diário (opcional)
#   npx wrangler secret put MAILJET_API_SECRET --config ./wrangler.toml # fallback do lembrete diário (opcional)
#   npx wrangler secret put MAILJET_WEBHOOK_SECRET --config ./wrangler.toml # senha Basic do webhook unsub/spam (opcional)
#   npx wrangler secret put ADMIN_EMAIL --config ./wrangler.toml      # dashboard /metrics: e-mail do admin (403 sem ele)
#   npx wrangler secret put ADMIN_GOOGLE_SUB --config ./wrangler.toml # opcional: amarra o admin ao sub do Google; ver docs/security.md
#   npx wrangler secret put PROXY_SHARED_SECRET --config ./wrangler.toml # mesmo valor do Pages; ver docs/security.md
# Local overrides go in .dev.vars (already has localhost values)
