name = "palpitae-api"
main = "src/index.ts"
compatibility_date = "2025-01-01"

[[d1_databases]]
binding = "DB"
database_name = "palpitae"
database_id = "ffd7a7ed-3434-4db8-a505-b74c1cf79d6a"
migrations_dir = "migrations"

[vars]
BASE_URL = "https://api.palpitae.com.br"
FRONTEND_URL = "https://palpitae.com.br"
# Secrets — set via:
#   wrangler secret put JWT_SECRET
#   wrangler secret put GOOGLE_CLIENT_ID
#   wrangler secret put GOOGLE_CLIENT_SECRET
#   wrangler secret put FOOTBALL_API_KEY
# Local overrides go in .dev.vars (already has localhost values)
