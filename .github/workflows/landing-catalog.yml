name: Landing Catalog

# Confere o catálogo da landing (web/src/pages/LandingPage/competitionCatalog.ts)
# contra GET /public/competitions de produção. A lista muda sem commit (uma
# competição termina ou volta a piloto), então este workflow fica fora do
# deploy-web.yml: nunca trava o deploy, nem um hotfix.
#
# Só reprova no PR que altera o próprio catálogo. Nos outros PRs, no push e na
# execução diária, a divergência vira aviso no resumo da execução.

on:
  pull_request:
    paths:
      - 'web/**'
      - '.github/workflows/landing-catalog.yml'
  push:
    branches:
      - main
    paths:
      - 'web/**'
      - '.github/workflows/landing-catalog.yml'
  schedule:
    # 10:00 UTC (07h BRT), depois da descoberta diária de jogos do Worker.
    - cron: '0 10 * * *'
  workflow_dispatch:

# Travado no versionamento: nenhum job aqui escreve no repositorio.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify landing catalog
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # O diff contra a base do PR precisa do histórico.
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24

      # O script só usa módulos do Node, sem npm ci.
      - name: Verify landing catalog
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE_SHA" ] && ! git diff --quiet "$BASE_SHA" HEAD -- src/pages/LandingPage/competitionCatalog.ts; then
            echo "O PR altera o catálogo da landing: divergência reprova."
            export CATALOG_STRICT=1
          fi
          npm run catalog:verify
