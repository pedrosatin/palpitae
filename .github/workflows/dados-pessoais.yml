name: Dados pessoais

# Workflow à parte do ci.yml: aquele ignora `docs/**` e `**.md`, justamente onde
# o vazamento aconteceu. Este roda em todo PR e em todo push à main.
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Checar e-mails, UUIDs e códigos de convite
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          # O script compara com o commit base e precisa dele no clone.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Varrer os arquivos alterados
        env:
          # PR: commit base. Push: commit anterior da main. Manual: vazio, varre tudo.
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            node scripts/personal-data-check.mjs --base "$BASE_SHA"
          else
            node scripts/personal-data-check.mjs --all
          fi
