name: Deploy Web

on:
  push:
    branches:
      - main
    paths:
      - 'web/**'
      - '.github/workflows/deploy-web.yml'

# Travado no versionamento: nenhum job aqui escreve no repositorio.
permissions:
  contents: read

# Deploy so pra main: se dois pushes entrarem juntos, o mais novo cancela
# o anterior e a producao termina no ultimo commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Run tests
        run: npm test

  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
        with:
          # O lastmod do sitemap usa git log; checkout raso cai sempre na data de hoje.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Falha se um script ou <style> inline do build não tiver hash na CSP de
      # dist/_headers, ou se um script externo vier de origem fora da política.
      - name: Verify CSP
        run: npm run csp:verify

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy dist --project-name=palpitae-web --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Envia todas as URLs do sitemap ao IndexNow depois do deploy de produção.
      - name: Notify IndexNow
        continue-on-error: true
        timeout-minutes: 5
        run: node scripts/indexnow.mjs
