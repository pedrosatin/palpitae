name: E2E Web

# Roda os testes Playwright de web/tests/e2e quando o PR mexe na web. Eles cobrem
# o que o Vitest em jsdom não alcança: layout real de 320 a 1491px, fluxo entre
# rotas, sessão atravessando reload e o caminho feliz completo. Os specs mockam a
# API com page.route sobre dois Vite dev servers: não há backend nem secret.
#
# Fica fora do ci.yml de propósito. O agregador `check` de lá reprova job pulado,
# e este só roda quando a web muda. Por isso o filtro de paths pode ficar no
# gatilho. Ainda não é check obrigatório: primeiro se mede a instabilidade.
#
# O cron noturno roda só o teste do gtag real (cookie-consent-layout-real-gtag),
# que baixa o script público do Google e por isso fica fora do PR. Sem a variável
# REAL_GTAG_ID no repositório, esse job é pulado.

on:
  pull_request:
    paths:
      - 'web/**'
      - 'package-lock.json'
      - '.github/workflows/e2e-web.yml'
  schedule:
    # 06:30 UTC (03h30 BRT).
    - cron: '30 6 * * *'
  workflow_dispatch:

# Travado no versionamento: nenhum job aqui escreve no repositório.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: E2E (Chromium)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      # O cache guarda só o navegador; as dependências de sistema vêm do apt a
      # cada execução, no step seguinte.
      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-shell-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # Os testes rodam headless, então basta o chromium-headless-shell: sem o
      # Chrome completo, o download e o cache ficam menores.
      - name: Install Chromium headless shell
        run: npx playwright install --with-deps --only-shell chromium

      - name: Run E2E
        run: npm run test:e2e

      # O relatório HTML traz o trace da nova tentativa. Só sobe quando falha.
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: web/playwright-report
          if-no-files-found: ignore
          retention-days: 7

  real-gtag:
    name: E2E gtag real
    if: github.event_name != 'pull_request' && vars.REAL_GTAG_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-shell-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium headless shell
        run: npx playwright install --with-deps --only-shell chromium

      # O id também configura o GA do dev server da porta 5174 (playwright.config.ts).
      - name: Run gtag test
        run: npm run test:e2e -- tests/e2e/cookie-consent-layout-real-gtag.spec.ts
        env:
          REAL_GTAG_ID: ${{ vars.REAL_GTAG_ID }}

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-real-gtag
          path: web/playwright-report
          if-no-files-found: ignore
          retention-days: 7
