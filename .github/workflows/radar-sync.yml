name: Radar Sync

# Coleta diária do radar de competições (/admin/oportunidades).
#
# Roda aqui, e não num Cron Trigger do Worker, porque a API-Football aplica
# rate limit POR IP e os IPs de saída dos Cloudflare Workers são compartilhados
# por milhares de clientes: do Worker a primeira chamada do dia já volta 429
# com a quota da conta intacta (2/100), enquanto de um runner do GitHub a mesma
# chamada devolve 200. Ver ADR-014.
#
# O script só gera SQL; quem escreve no D1 é o wrangler, com o mesmo token que
# o CI já usa para deploy e migrações — a chave da API-Football nunca toca no
# Cloudflare e o token do Cloudflare nunca toca na API-Football.

on:
  schedule:
    # 07:00 UTC (04h BRT) — depois da descoberta de jogos do Worker.
    - cron: '0 7 * * *'
  # Permite rodar sob demanda pelo painel do GitHub (útil no primeiro
  # snapshot e para reprocessar um dia que falhou).
  workflow_dispatch:

# Travado no versionamento: nenhum job aqui escreve no repositorio.
permissions:
  contents: read

# NUNCA cancelar em andamento: o job grava no D1 de producao com
# `wrangler d1 execute`, e abortar no meio deixaria o snapshot pela metade.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    name: Coletar e gravar snapshot
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Coletar oferta e interesse
        run: npx tsx scripts/radarSync.ts radar.sql
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}

      - name: Aplicar snapshot no D1
        run: npx wrangler d1 execute palpitae --remote --config ./wrangler.toml --file=radar.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
