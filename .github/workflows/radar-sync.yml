name: Radar Sync

# Coleta diária do radar de competições (/admin/oportunidades).
#
# Hoje o provedor é a ESPN (sem chave, sem política por IP — ADR-015), então
# não é mais rate limit que impede rodar no Worker. Continua no Actions por
# escolha de arquitetura (herdada da ADR-014): o script só gera SQL, e quem
# escreve no D1 é o wrangler, com o mesmo token que o CI já usa para deploy e
# migrações. Nenhuma credencial de coleta existe — só a do Cloudflare.

on:
  schedule:
    # 07:00 UTC (04h BRT) — depois da descoberta de jogos do Worker.
    - cron: '0 7 * * *'
  # Permite rodar sob demanda pelo painel do GitHub (útil no primeiro
  # snapshot e para reprocessar um dia que falhou).
  workflow_dispatch:

# Travado no versionamento: nenhum job aqui escreve no repositorio.
permissions:
  contents: read

# NUNCA cancelar em andamento: o job grava no D1 de producao com
# `wrangler d1 execute`, e abortar no meio deixaria o snapshot pela metade.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    name: Coletar e gravar snapshot
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Coletar oferta e interesse
        run: npx tsx scripts/radarSync.ts radar.sql

      - name: Aplicar snapshot no D1
        run: npx wrangler d1 execute palpitae --remote --config ./wrangler.toml --file=radar.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
